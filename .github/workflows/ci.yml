# CI — runs on every PR and every push to main. Required checks: AGENTS.md §CI.
# Rerun or narrow a run by commenting `/ci ...` on the PR (ci-command.yml dispatches this
# workflow and this one reports back), or with `gh workflow run` (AGENTS.md §CI).
#
# macOS work: `build` compiles once (build-for-testing), then `unit-tests` and the `ui-tests`
# shards (scripts/ci/ui_shards.py) run its products in parallel, one runner each. The ubuntu
# `tests` job sums them up and is the one test check the ruleset needs. The account runs at most 5
# macOS jobs at once across all its repos; a full run here takes 4 at a time (build, then 1 unit +
# 3 UI), leaving one for a main-push run or the sibling repo.
#
# Docs-only PRs skip build and every test job: the cheap `changes` job lists the PR's files and
# outputs code=false only when every one is docs (the rules are in scripts/ci/docs_only.py), and
# `tests` then passes. Pushes to main, manual runs and any error reading the list output code=true.
# Never use a workflow-level paths-ignore for this: the required checks would never report.
# An automatic run (PR or push) runs unit and UI tests; `tests` and `test` only shape manual runs.
name: CI
run-name: "${{ inputs.pr && format('CI · PR #{0}', inputs.pr) || 'CI' }} · ${{ inputs.only || 'gates+build' }} · ${{ inputs.test && format('test={0} x{1}', inputs.test, inputs.iterations) || format('tests={0}', inputs.tests) }}"

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma list, no spaces, of lint,secrets,large-files,i18n,build; empty runs all four gates + build"
        type: string
        default: ""
      tests:
        description: "Tests after the gates: none (compile only), unit, or ui (unit and UI)"
        type: choice
        options: [none, unit, ui]
        default: none
      test:
        description: "One class or test, as make focused-tests takes it (<target>/<Class>[/<test>]); replaces `tests`"
        type: string
        default: ""
      iterations:
        description: "How many times to run `test`, 1-10"
        type: string
        default: "1"
      pr:
        description: "PR number to post the results on (set by a /ci comment); empty posts nothing"
        type: string
        default: ""
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (a new push to a PR voids the old run). The selection is
# in the group so `/ci lint` and `/ci unit` on one branch don't cancel each other. A push to main
# gets a group of its own commit, so every merge keeps a full run that shows which commit broke it
# (a shared group would still drop a queued main run when a newer one arrives).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}-${{ inputs.only }}-${{ inputs.tests }}-${{ inputs.test }}-${{ inputs.iterations }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Docs-only detection (ubuntu, seconds) ---------------------------------------
  # Both the changed path and, for a rename, the previous one count, so a file renamed out of the
  # app folder is still code. Anything but a PR event, or a failed read, means code=true.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: Classify the PR's files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The files API stops at 3000 files, so a bigger PR could look docs-only; it counts as code.
          if [[ "$EVENT" != pull_request ]] \
            || ! count=$(gh api "repos/${REPO}/pulls/${PR}" --jq .changed_files) \
            || [[ ! "$count" =~ ^[0-9]+$ ]] || (( count >= 3000 )) \
            || ! files=$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/docs_only.py <<<"$files" >> "$GITHUB_OUTPUT" \
            || echo "code=true" >> "$GITHUB_OUTPUT"

  # --- Tier 1: lint/format parity with pre-commit (ubuntu) -------------------
  # Versions come from config/lint-tools.env. Runs REPO-WIDE, unlike the local gate
  # (AGENTS.md §"Lint policy").
  lint:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',lint,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load pinned tool versions
        run: grep -E '^[A-Z_]+=' config/lint-tools.env >> "$GITHUB_ENV"

      - name: Cache pinned SwiftFormat binary
        uses: actions/cache@v6
        id: cache-swiftformat
        with:
          path: swiftformat_linux
          key: swiftformat-${{ env.SWIFTFORMAT_VERSION }}

      - name: Install pinned SwiftFormat (Linux release binary)
        if: steps.cache-swiftformat.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o swiftformat_linux.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -o -q swiftformat_linux.zip
          chmod +x swiftformat_linux

      - name: SwiftFormat (check only, no rewrite)
        run: |
          ./swiftformat_linux --version
          ./swiftformat_linux --lint .

      # The official image, not the release zip: that binary needs libxml2.so.2, which
      # Ubuntu 26.04 dropped (realm/SwiftLint#6966).
      # The workspace is mounted at its own path so reported file paths match the checkout.
      - name: SwiftLint (strict, official Docker image)
        run: |
          image="ghcr.io/realm/swiftlint:${SWIFTLINT_VERSION}"
          docker run --rm "$image" version
          docker run --rm -v "$PWD:$PWD" -w "$PWD" "$image" lint --strict

  # --- Tier 1: secret scan over full history (ubuntu) -------------------------
  # Full-history scan. Green != no secrets — AGENTS.md §"Known issues".
  secrets:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',secrets,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `gitleaks git` can scan every commit
      - name: Load pinned tool versions
        run: grep -E '^[A-Z_]+=' config/lint-tools.env >> "$GITHUB_ENV"
      - name: Cache pinned gitleaks binary
        uses: actions/cache@v6
        id: cache-gitleaks
        with:
          path: gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}
      - name: Install pinned gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: gitleaks git
        run: |
          ./gitleaks version
          ./gitleaks git --no-banner --redact

  # --- check-large-files: reject oversized files added/changed in the PR -----
  # Mirrors the pre-commit hook (scripts/check-large-files.sh), which only ever
  # sees staged files locally — here we diff against the PR base (or the prior
  # push, on a push-to-main event, or the branch point from main, on a manual
  # run) since there's no "staged files" concept in CI.
  check-large-files:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',large-files,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff files vs base
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" ]]; then
            base="$(git merge-base origin/main HEAD)"
          fi
          files=$(git diff --name-only --diff-filter=d "$base"...HEAD | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: check-large-files
        if: steps.diff.outputs.files != ''
        run: bash scripts/check-large-files.sh ${{ steps.diff.outputs.files }}

  # --- Localization gates (ubuntu) --------------------------------------------
  # The i18n-check and doc-check scripts, plus check_metadata, the plural audit,
  # and a non-blocking consistency report. The
  # uitest-check scripts don't run in CI.
  i18n-gates:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',i18n,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # check_doc_pointers diffs against main for its history scan
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: check_translations.py
        run: python3 scripts/ci/annotate.py --name check_translations -- python3 scripts/check_translations.py
      - name: check_source_strings.py
        run: python3 scripts/ci/annotate.py --name check_source_strings -- python3 scripts/check_source_strings.py
      - name: check_metadata.py
        run: python3 scripts/ci/annotate.py --name check_metadata -- python3 scripts/translate_metadata/check_metadata.py
      - name: plural_completeness.py
        run: python3 scripts/ci/annotate.py --name plural_completeness -- python3 scripts/translate_audit/plural_completeness.py
      - name: untranslated_copies.py
        run: python3 scripts/ci/annotate.py --name untranslated_copies -- python3 scripts/translate_audit/untranslated_copies.py
      - name: distinct_pairs.py
        run: python3 scripts/ci/annotate.py --name distinct_pairs -- python3 scripts/translate_audit/distinct_pairs.py
      - name: check_doc_pointers.py
        run: python3 scripts/ci/annotate.py --name check_doc_pointers -- python3 scripts/check_doc_pointers.py
      - name: consistency_check (informational, non-blocking)
        run: python3 scripts/translate_audit/consistency_check.py --ignore-casing || true

  # --- Tier 2: build once (macOS) ---------------------------------------------------
  # Compiles the app and both test targets once (build-for-testing) and hands the products to the
  # test jobs, which only run them, so a PR compiles once rather than once per test job. It is also
  # the compile check: a manual run with no tests runs it alone. Skipped on docs-only PRs, and with
  # it every test job.
  build:
    runs-on: xcode-27
    needs: [lint, secrets, check-large-files, i18n-gates, changes]
    # Runs after whichever gates ran; a failed gate still stops it.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && needs.changes.outputs.code == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.tests != 'none' || inputs.test != ''
        || inputs.only == '' || contains(format(',{0},', inputs.only), ',build,'))
    # The 360-minute default would let one hung build hold a macOS runner for six hours.
    timeout-minutes: 30
    env:
      # Whether a test job will use the products, so they're worth uploading.
      RUNS_TESTS: ${{ github.event_name != 'workflow_dispatch' || inputs.tests != 'none' || inputs.test != '' }}
    steps:
      # Before any setup, so a bad `gh workflow run` input costs no macOS minutes. The same checks
      # as ci_command.py; leading zeros are refused because bash reads them as octal.
      - name: Check the test name and iterations
        if: inputs.test != ''
        env:
          TEST: ${{ inputs.test }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          if [[ ! "$TEST" =~ ^(checklistsTests|checklistsUITests)/[A-Za-z_][A-Za-z0-9_]*(/[A-Za-z_][A-Za-z0-9_]*(\(\))?)?$ ]]; then
            echo "::error::test must be <target>/<Class>[/<test>] in checklistsTests or checklistsUITests, not '${TEST}'"
            exit 1
          fi
          if [[ ! "$ITERATIONS" =~ ^[1-9][0-9]*$ ]] || (( ITERATIONS > 10 )); then
            echo "::error::iterations must be 1-10, not '${ITERATIONS}'"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
        with:
          simulator: "false"
      - name: Cache SwiftPM packages
        uses: actions/cache@v6
        with:
          path: .build/sim/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-xcode27.2-${{ hashFiles('checklists/checklists.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode27.2-
      # For any simulator, so the products run on whichever device a test job's runner has. On
      # failure, each compile error becomes a PR annotation and a job-summary line.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project checklists/checklists.xcodeproj \
            -scheme checklists \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/sim/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build-for-testing.log \
            || { python3 scripts/ci/xcode_errors.py build-for-testing.log; exit 1; }
      # A tarball, because an artifact upload drops the exec bits and symlinks the app needs.
      - name: Pack the test products
        if: env.RUNS_TESTS == 'true'
        run: tar -czf test-products.tgz -C .build/sim/DerivedData/Build Products
      - name: Upload the test products
        if: env.RUNS_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: test-products.tgz
          retention-days: 1
          compression-level: 0 # already gzipped

  # --- Tier 2: tests (macOS), from the build job's products ----------------------------
  # An automatic run (PR or push) runs unit-tests and every ui-tests shard, in parallel; a manual
  # run runs what `tests` or `test` ask for. Each job is serial on one simulator. The `tests` job
  # below sums them up, and it is the one check the ruleset needs.
  unit-tests:
    runs-on: xcode-27
    needs: [build]
    if: >-
      !cancelled() && needs.build.result == 'success' && inputs.test == ''
      && (github.event_name != 'workflow_dispatch' || inputs.tests == 'unit' || inputs.tests == 'ui')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
      - uses: ./.github/actions/test-products
      # Under the job's timeout: a step timeout fails the step, so the result bundles still upload,
      # while a job timeout cancels the job and skips the upload.
      - name: Unit tests (make unit-tests)
        timeout-minutes: 25
        run: make unit-tests
      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresults-unit-tests
          path: .build/sim/results/*.xcresult
          retention-days: 7

  # The shards are defined in scripts/ci/ui_shards.py; keep this list equal to its names (a test in
  # scripts/tests/test_ui_shards.py checks). `rest` runs every class no other shard names.
  ui-tests:
    name: ui-tests (${{ matrix.shard }})
    runs-on: xcode-27
    needs: [build]
    if: >-
      !cancelled() && needs.build.result == 'success' && inputs.test == ''
      && (github.event_name != 'workflow_dispatch' || inputs.tests == 'ui')
    timeout-minutes: 40
    env:
      # Animations off for UI tests on CI only (TestAnimationsOverride in the app explains why).
      TEST_RUNNER_FORCE_ANIMATIONS: "off"
    strategy:
      fail-fast: false # one red shard still lets the others report
      matrix:
        shard: [accessibility, editing, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
      - uses: ./.github/actions/test-products
      # Serial on this runner's one simulator, which first warms up with one small unit suite
      # (warm_up_if_needed in scripts/_destination.sh).
      - name: UI tests (make ui-tests UI_SHARD=${{ matrix.shard }})
        timeout-minutes: 35
        env:
          UI_SHARD: ${{ matrix.shard }}
          UI_WORKERS: "1"
          UI_RETRY_ON_FAILURE: "1"
        run: make ui-tests
      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresults-ui-tests-${{ matrix.shard }}
          path: .build/sim/results/*.xcresult
          retention-days: 7

  # One class or test, serially, N times in one job (a manual `test` run), so a flake that shows
  # only on this runner costs one build rather than a whole suite per try. A UI class first warms
  # the fresh simulator up, as make focused-tests does locally. A name that matches no test fails
  # the step rather than passing with nothing run.
  focused-tests:
    runs-on: xcode-27
    needs: [build]
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.event_name == 'workflow_dispatch' && inputs.test != ''
    timeout-minutes: 40
    env:
      TEST_RUNNER_FORCE_ANIMATIONS: "off" # as in ui-tests
    outputs:
      tally: ${{ steps.one.outputs.tally }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
      - uses: ./.github/actions/test-products
      - name: One class or test (make focused-tests)
        id: one
        timeout-minutes: 35
        env:
          TEST: ${{ inputs.test }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          rc=0
          make focused-tests ONLY="$TEST" ITERATIONS="$ITERATIONS" || rc=$?
          bundle=$(find .build/sim/results -maxdepth 1 -name '*-focused.xcresult' 2>/dev/null | head -1)
          if [[ -n "$bundle" ]]; then
            tally=$(python3 scripts/ci/tally_iterations.py "$bundle" || true)
            echo "tally=${tally}" >> "$GITHUB_OUTPUT"
            echo "$tally" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$tally" == "Tally: no test results"* && "$rc" == 0 ]]; then
              echo "::error::'${TEST}' matched no test"
              rc=1
            fi
          fi
          exit "$rc"
      # Kept when it passes too: with a flake, the passing runs are evidence as well.
      - name: Upload test result bundles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: xcresults-focused-tests
          path: .build/sim/results/*.xcresult
          retention-days: 7

  # --- The required check: sums up the build and test jobs (ubuntu, seconds) -------------
  # Passes when every job this run asked for passed, or when `changes` found a docs-only PR and
  # the build and tests were skipped. Anything else fails, including a failed gate, `changes`, or
  # `build` (the test jobs are then skipped, which on their own would count as passing). Shards can
  # be added or renamed without touching the ruleset. Skipped on a manual run with no tests.
  tests:
    runs-on: ubuntu-latest
    needs: [changes, build, unit-tests, ui-tests, focused-tests]
    if: >-
      !cancelled()
      && (github.event_name != 'workflow_dispatch' || inputs.tests != 'none' || inputs.test != '')
    timeout-minutes: 5
    steps:
      - name: Sum up the build and test jobs
        env:
          CODE: ${{ needs.changes.outputs.code }}
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit-tests.result }}
          UI: ${{ needs.ui-tests.result }}
          FOCUSED: ${{ needs.focused-tests.result }}
          WANT: ${{ inputs.test != '' && 'focused' || inputs.tests || 'ui' }}
        run: |
          echo "changes.code=${CODE} build=${BUILD} unit-tests=${UNIT} ui-tests=${UI} focused-tests=${FOCUSED} (asked for: ${WANT})"
          if [[ "$CODE" == false && "$BUILD" == skipped && "$UNIT" == skipped && "$UI" == skipped ]]; then
            echo "Docs-only PR: build and tests skipped."
            exit 0
          fi
          case "$WANT" in
            ui) jobs=(BUILD UNIT UI) ;;
            unit) jobs=(BUILD UNIT) ;;
            focused) jobs=(BUILD FOCUSED) ;;
            *) echo "::error::unknown test selection '${WANT}'"; exit 1 ;;
          esac
          for job in "${jobs[@]}"; do
            if [[ "${!job}" != success ]]; then
              echo "::error::Tests did not pass (build=${BUILD}, unit-tests=${UNIT}, ui-tests=${UI}, focused-tests=${FOCUSED})."
              exit 1
            fi
          done

  # --- Report back to the PR that asked for this run (a /ci comment) --------------
  # Also runs when a started run was cancelled, so it still leaves its line on the PR (a run
  # cancelled while still queued never starts, so it posts nothing).
  report:
    needs: [lint, secrets, check-large-files, i18n-gates, changes, build, unit-tests, ui-tests, focused-tests, tests]
    if: always() && inputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment the results on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          NEEDS: ${{ toJSON(needs) }}
          SELECTION: ${{ inputs.only || 'gates+build' }}
          TESTS: ${{ inputs.test && format('test=`{0}` x{1}', inputs.test, inputs.iterations) || format('tests={0}', inputs.tests) }}
          TALLY: ${{ needs.focused-tests.outputs.tally }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rows=$(jq -r '
            {success: "✅", failure: "❌", skipped: "⏭️", cancelled: "🚫"} as $icon
            | to_entries[] | "| `\(.key)` | \($icon[.value.result] // "") \(.value.result) |"' <<<"$NEEDS")
          verdict=$(jq -r '[.[].result] as $r
            | if ($r | index("failure")) then "❌ failed"
              elif ($r | index("cancelled")) then "🚫 cancelled"
              else "✅ passed" end' <<<"$NEEDS")
          {
            echo "**CI ${verdict}** on \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`: ${SELECTION}, ${TESTS}. [Run](${RUN_URL})"
            echo
            if [[ -n "$TALLY" ]]; then
              echo "$TALLY"
              echo
            fi
            echo "| Job | Result |"
            echo "|---|---|"
            echo "$rows"
          } > report.md
          gh pr comment "$PR" --body-file report.md

