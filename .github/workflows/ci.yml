# CI — DISABLED (workflow_dispatch only; private repo, macOS minutes bill at 10x).
# To enable: uncomment the pull_request/push triggers AND add these jobs as required
# status checks.
name: CI

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Tests after the gates: none (compile only), unit, or ui (unit then UI)"
        type: choice
        options: [none, unit, ui]
        default: none
  # pull_request:
  # push:
  #   branches: [main]

# Cancel superseded runs on the same ref (a new push to a PR voids the old run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Tier 1: lint/format parity with pre-commit (ubuntu) -------------------
  # Versions come from config/lint-tools.env. Runs REPO-WIDE, unlike the local gate
  # (AGENTS.md §"Lint policy").
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load pinned tool versions
        run: grep -E '^[A-Z_]+=' config/lint-tools.env >> "$GITHUB_ENV"

      - name: Cache pinned SwiftFormat binary
        uses: actions/cache@v6
        id: cache-swiftformat
        with:
          path: swiftformat_linux
          key: swiftformat-${{ env.SWIFTFORMAT_VERSION }}

      - name: Install pinned SwiftFormat (Linux release binary)
        if: steps.cache-swiftformat.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o swiftformat_linux.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -o -q swiftformat_linux.zip
          chmod +x swiftformat_linux

      - name: SwiftFormat (check only, no rewrite)
        run: |
          ./swiftformat_linux --version
          ./swiftformat_linux --lint .

      # The official image, not the release zip: that binary needs libxml2.so.2, which
      # Ubuntu 26.04 dropped (realm/SwiftLint#6966).
      # The workspace is mounted at its own path so reported file paths match the checkout.
      - name: SwiftLint (strict, official Docker image)
        run: |
          image="ghcr.io/realm/swiftlint:${SWIFTLINT_VERSION}"
          docker run --rm "$image" version
          docker run --rm -v "$PWD:$PWD" -w "$PWD" "$image" lint --strict

  # --- Tier 1: secret scan over full history (ubuntu) -------------------------
  # Full-history scan. Green != no secrets — AGENTS.md §"Known issues".
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `gitleaks git` can scan every commit
      - name: Load pinned tool versions
        run: grep -E '^[A-Z_]+=' config/lint-tools.env >> "$GITHUB_ENV"
      - name: Cache pinned gitleaks binary
        uses: actions/cache@v6
        id: cache-gitleaks
        with:
          path: gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}
      - name: Install pinned gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: gitleaks git
        run: |
          ./gitleaks version
          ./gitleaks git --no-banner --redact

  # --- check-large-files: reject oversized files added/changed in the PR -----
  # Mirrors the pre-commit hook (scripts/check-large-files.sh), which only ever
  # sees staged files locally — here we diff against the PR base (or the prior
  # push, on a push-to-main event, or the branch point from main, on a manual
  # run) since there's no "staged files" concept in CI.
  check-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff files vs base
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" ]]; then
            base="$(git merge-base origin/main HEAD)"
          fi
          files=$(git diff --name-only --diff-filter=d "$base"...HEAD | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: check-large-files
        if: steps.diff.outputs.files != ''
        run: bash scripts/check-large-files.sh ${{ steps.diff.outputs.files }}

  # --- Localization gates (ubuntu) --------------------------------------------
  # The i18n-check and doc-check scripts, plus check_metadata, the plural audit,
  # and a non-blocking consistency report. The
  # uitest-check scripts don't run in CI.
  i18n-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # check_doc_pointers diffs against main for its history scan
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: check_translations.py
        run: python3 scripts/ci/annotate.py --name check_translations -- python3 scripts/check_translations.py
      - name: check_source_strings.py
        run: python3 scripts/ci/annotate.py --name check_source_strings -- python3 scripts/check_source_strings.py
      - name: check_metadata.py
        run: python3 scripts/ci/annotate.py --name check_metadata -- python3 scripts/translate_metadata/check_metadata.py
      - name: plural_completeness.py
        run: python3 scripts/ci/annotate.py --name plural_completeness -- python3 scripts/translate_audit/plural_completeness.py
      - name: untranslated_copies.py
        run: python3 scripts/ci/annotate.py --name untranslated_copies -- python3 scripts/translate_audit/untranslated_copies.py
      - name: distinct_pairs.py
        run: python3 scripts/ci/annotate.py --name distinct_pairs -- python3 scripts/translate_audit/distinct_pairs.py
      - name: check_doc_pointers.py
        run: python3 scripts/ci/annotate.py --name check_doc_pointers -- python3 scripts/check_doc_pointers.py
      - name: consistency_check (informational, non-blocking)
        run: python3 scripts/translate_audit/consistency_check.py --ignore-casing || true

  # --- Tier 2: compile check (macOS — 10× minute cost on a private repo) ------
  build:
    runs-on: xcode-27
    needs: [lint, secrets, check-large-files, i18n-gates]
    # The 360-minute default would let one hung simulator burn the month's allowance.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"
      - name: Cache SwiftPM packages
        uses: actions/cache@v6
        with:
          path: |
            .build/DerivedData/SourcePackages
            .build/sim/DerivedData/SourcePackages
          # The mode is in the key: a compile-only run fills one path and a test run the other, and
          # an exact hit is never saved again, so a shared key would leave one mode uncached.
          key: spm-${{ runner.os }}-xcode27.2-${{ (inputs.tests == 'unit' || inputs.tests == 'ui') && 'sim' || 'build' }}-${{ hashFiles('checklists/checklists.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode27.2-${{ (inputs.tests == 'unit' || inputs.tests == 'ui') && 'sim' || 'build' }}-
      # Mirrors scripts/build.sh. Skipped when tests run: their build-for-testing is the
      # compile check, and building here too would compile everything twice.
      - name: xcodebuild build
        if: inputs.tests != 'unit' && inputs.tests != 'ui'
        run: |
          xcodebuild build \
            -project checklists/checklists.xcodeproj \
            -scheme checklists \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      # --- Opt-in tests (workflow_dispatch input `tests`) -----------------------
      # The runner image can lag the pinned Xcode's simulator runtime, and the app's
      # deployment target needs that runtime, so fetch it when it's missing.
      - name: iOS simulator runtime for the selected Xcode
        if: inputs.tests == 'unit' || inputs.tests == 'ui'
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          if xcrun simctl list runtimes --json \
            | python3 -c 'import json,sys; v=sys.argv[1]; sys.exit(0 if any(r["isAvailable"] and "iOS" in r["name"] and r["version"].startswith(v) for r in json.load(sys.stdin)["runtimes"]) else 1)' "$sdk"; then
            echo "iOS ${sdk} simulator runtime already installed"
          else
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes

      # Each phase is its own step so the run's step timings split build+unit from UI.
      - name: Unit tests (make test-unit; includes build-for-testing)
        if: inputs.tests == 'unit' || inputs.tests == 'ui'
        run: make test-unit

      # The runner is this repo's alone, so no slot pool: two simulator clones, the most its memory
      # holds (scripts/_destination.sh, take_slots).
      - name: UI tests (make test-ui, 2 workers)
        if: inputs.tests == 'ui'
        env:
          SIMULATOR_WORKERS_WITHOUT_POOL: "2"
        run: make test-ui

      # Failures are easier to read in the bundle than in the log.
      - name: Upload test result bundles
        if: failure() && (inputs.tests == 'unit' || inputs.tests == 'ui')
        uses: actions/upload-artifact@v7
        with:
          name: xcresults
          path: .build/sim/results/*.xcresult
          retention-days: 7
