# CI — runs on every PR and every push to main. Required checks: AGENTS.md §CI.
# Rerun or narrow a run by commenting `/ci ...` on the PR (ci-command.yml dispatches this
# workflow and this one reports back), or with `gh workflow run` (AGENTS.md §CI).
#
# Docs-only PRs skip the macOS jobs (build, test): the cheap `changes` job lists the PR's files
# and outputs code=false only when every one is docs (the rules are in scripts/ci/docs_only.py).
# Pushes to main, manual runs and any error reading the list output code=true. GitHub counts a skipped required check as passing, so such a PR stays mergeable.
# Never use a workflow-level paths-ignore for this: the required checks would never report.
# An automatic run (PR or push) runs unit then UI tests; `tests` and `test` only shape manual runs.
name: CI
run-name: "${{ inputs.pr && format('CI · PR #{0}', inputs.pr) || 'CI' }} · ${{ inputs.only || 'gates+build' }} · ${{ inputs.test && format('test={0} x{1}', inputs.test, inputs.iterations) || format('tests={0}', inputs.tests) }}"

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma list, no spaces, of lint,secrets,large-files,i18n,build; empty runs all four gates + build"
        type: string
        default: ""
      tests:
        description: "Tests after the gates: none (compile only), unit, or ui (unit then UI)"
        type: choice
        options: [none, unit, ui]
        default: none
      test:
        description: "One class or test, as make test-only takes it (<target>/<Class>[/<test>]); replaces `tests`"
        type: string
        default: ""
      iterations:
        description: "How many times to run `test`, 1-10"
        type: string
        default: "1"
      pr:
        description: "PR number to post the results on (set by a /ci comment); empty posts nothing"
        type: string
        default: ""
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (a new push to a PR voids the old run). The selection is
# in the group so `/ci lint` and `/ci unit` on one branch don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.only }}-${{ inputs.tests }}-${{ inputs.test }}-${{ inputs.iterations }}
  # Not on main, so every merge keeps a full run that shows which commit broke it.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  # --- Docs-only detection (ubuntu, seconds) ---------------------------------------
  # Both the changed path and, for a rename, the previous one count, so a file renamed out of the
  # app folder is still code. Anything but a PR event, or a failed read, means code=true.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: Classify the PR's files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The files API stops at 3000 files, so a bigger PR could look docs-only; it counts as code.
          if [[ "$EVENT" != pull_request ]] \
            || ! count=$(gh api "repos/${REPO}/pulls/${PR}" --jq .changed_files) \
            || [[ ! "$count" =~ ^[0-9]+$ ]] || (( count >= 3000 )) \
            || ! files=$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/docs_only.py <<<"$files" >> "$GITHUB_OUTPUT" \
            || echo "code=true" >> "$GITHUB_OUTPUT"

  # --- Tier 1: lint/format parity with pre-commit (ubuntu) -------------------
  # Versions come from config/lint-tools.env. Runs REPO-WIDE, unlike the local gate
  # (AGENTS.md §"Lint policy").
  lint:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',lint,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load pinned tool versions
        run: grep -E '^[A-Z_]+=' config/lint-tools.env >> "$GITHUB_ENV"

      - name: Cache pinned SwiftFormat binary
        uses: actions/cache@v6
        id: cache-swiftformat
        with:
          path: swiftformat_linux
          key: swiftformat-${{ env.SWIFTFORMAT_VERSION }}

      - name: Install pinned SwiftFormat (Linux release binary)
        if: steps.cache-swiftformat.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o swiftformat_linux.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -o -q swiftformat_linux.zip
          chmod +x swiftformat_linux

      - name: SwiftFormat (check only, no rewrite)
        run: |
          ./swiftformat_linux --version
          ./swiftformat_linux --lint .

      # The official image, not the release zip: that binary needs libxml2.so.2, which
      # Ubuntu 26.04 dropped (realm/SwiftLint#6966).
      # The workspace is mounted at its own path so reported file paths match the checkout.
      - name: SwiftLint (strict, official Docker image)
        run: |
          image="ghcr.io/realm/swiftlint:${SWIFTLINT_VERSION}"
          docker run --rm "$image" version
          docker run --rm -v "$PWD:$PWD" -w "$PWD" "$image" lint --strict

  # --- Tier 1: secret scan over full history (ubuntu) -------------------------
  # Full-history scan. Green != no secrets — AGENTS.md §"Known issues".
  secrets:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',secrets,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `gitleaks git` can scan every commit
      - name: Load pinned tool versions
        run: grep -E '^[A-Z_]+=' config/lint-tools.env >> "$GITHUB_ENV"
      - name: Cache pinned gitleaks binary
        uses: actions/cache@v6
        id: cache-gitleaks
        with:
          path: gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}
      - name: Install pinned gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: gitleaks git
        run: |
          ./gitleaks version
          ./gitleaks git --no-banner --redact

  # --- check-large-files: reject oversized files added/changed in the PR -----
  # Mirrors the pre-commit hook (scripts/check-large-files.sh), which only ever
  # sees staged files locally — here we diff against the PR base (or the prior
  # push, on a push-to-main event, or the branch point from main, on a manual
  # run) since there's no "staged files" concept in CI.
  check-large-files:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',large-files,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff files vs base
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" ]]; then
            base="$(git merge-base origin/main HEAD)"
          fi
          files=$(git diff --name-only --diff-filter=d "$base"...HEAD | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: check-large-files
        if: steps.diff.outputs.files != ''
        run: bash scripts/check-large-files.sh ${{ steps.diff.outputs.files }}

  # --- Localization gates (ubuntu) --------------------------------------------
  # The i18n-check and doc-check scripts, plus check_metadata, the plural audit,
  # and a non-blocking consistency report. The
  # uitest-check scripts don't run in CI.
  i18n-gates:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',i18n,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # check_doc_pointers diffs against main for its history scan
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: check_translations.py
        run: python3 scripts/ci/annotate.py --name check_translations -- python3 scripts/check_translations.py
      - name: check_source_strings.py
        run: python3 scripts/ci/annotate.py --name check_source_strings -- python3 scripts/check_source_strings.py
      - name: check_metadata.py
        run: python3 scripts/ci/annotate.py --name check_metadata -- python3 scripts/translate_metadata/check_metadata.py
      - name: plural_completeness.py
        run: python3 scripts/ci/annotate.py --name plural_completeness -- python3 scripts/translate_audit/plural_completeness.py
      - name: untranslated_copies.py
        run: python3 scripts/ci/annotate.py --name untranslated_copies -- python3 scripts/translate_audit/untranslated_copies.py
      - name: distinct_pairs.py
        run: python3 scripts/ci/annotate.py --name distinct_pairs -- python3 scripts/translate_audit/distinct_pairs.py
      - name: check_doc_pointers.py
        run: python3 scripts/ci/annotate.py --name check_doc_pointers -- python3 scripts/check_doc_pointers.py
      - name: consistency_check (informational, non-blocking)
        run: python3 scripts/translate_audit/consistency_check.py --ignore-casing || true

  # --- Tier 2: compile check (macOS) -----------------------------------------
  # Manual runs only, and only when no tests were asked for: a run with tests compiles in `test`
  # (its build-for-testing), and building here too would compile everything twice. Skipped on
  # docs-only PRs. Skipped counts as passing for a required check.
  build:
    runs-on: xcode-27
    needs: [lint, secrets, check-large-files, i18n-gates, changes]
    # Runs when selected, after whichever gates ran; a failed gate still stops it.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && needs.changes.outputs.code == 'true'
      && github.event_name == 'workflow_dispatch' && inputs.tests == 'none' && inputs.test == ''
      && (inputs.only == '' || contains(format(',{0},', inputs.only), ',build,'))
    # The 360-minute default would let one hung simulator hold the runner for six hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"
      - name: Cache SwiftPM packages
        uses: actions/cache@v6
        with:
          path: .build/DerivedData/SourcePackages
          # Its own key: `test` fills the simulator path, and an exact hit is never saved again.
          key: spm-${{ runner.os }}-xcode27.2-build-${{ hashFiles('checklists/checklists.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode27.2-build-
      # Mirrors scripts/build.sh.
      - name: xcodebuild build
        run: |
          xcodebuild build \
            -project checklists/checklists.xcodeproj \
            -scheme checklists \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

  # --- Tier 2: tests (macOS) -------------------------------------------------
  # An automatic run (PR or push) runs unit then UI tests; a manual run runs what `tests` or
  # `test` ask for, and none when neither does. Its build-for-testing is the compile check.
  # Skipped on docs-only PRs. Skipped counts as passing for a required check.
  test:
    runs-on: xcode-27
    needs: [lint, secrets, check-large-files, i18n-gates, changes]
    # Tests imply the build, after whichever gates ran; a failed gate still stops it.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && needs.changes.outputs.code == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.tests != 'none' || inputs.test != '')
    # The 360-minute default would let one hung simulator hold the runner for six hours.
    timeout-minutes: 90
    env:
      TEST_MODE: ${{ inputs.test != '' && 'one' || inputs.tests || 'ui' }}
    outputs:
      tally: ${{ steps.one.outputs.tally }}
    steps:
      # Before any setup, so a bad `gh workflow run` input costs no macOS minutes. The same checks
      # as ci_command.py; leading zeros are refused because bash reads them as octal.
      - name: Check the test name and iterations
        if: env.TEST_MODE == 'one'
        env:
          TEST: ${{ inputs.test }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          if [[ ! "$TEST" =~ ^(checklistsTests|checklistsUITests)/[A-Za-z_][A-Za-z0-9_]*(/[A-Za-z_][A-Za-z0-9_]*(\(\))?)?$ ]]; then
            echo "::error::test must be <target>/<Class>[/<test>] in checklistsTests or checklistsUITests, not '${TEST}'"
            exit 1
          fi
          if [[ ! "$ITERATIONS" =~ ^[1-9][0-9]*$ ]] || (( ITERATIONS > 10 )); then
            echo "::error::iterations must be 1-10, not '${ITERATIONS}'"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Select Xcode 27.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"
      - name: Cache SwiftPM packages
        uses: actions/cache@v6
        with:
          path: .build/sim/DerivedData/SourcePackages
          # Its own key: `build` fills the other path, and an exact hit is never saved again.
          key: spm-${{ runner.os }}-xcode27.2-sim-${{ hashFiles('checklists/checklists.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode27.2-sim-

      # --- Tests (automatic runs: unit then UI; manual runs: inputs `tests` and `test`) ------
      # The runner image can lag the pinned Xcode's simulator runtime, and the app's
      # deployment target needs that runtime, so fetch it when it's missing.
      - name: iOS simulator runtime for the selected Xcode
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          if xcrun simctl list runtimes --json \
            | python3 -c 'import json,sys; v=sys.argv[1]; sys.exit(0 if any(r["isAvailable"] and "iOS" in r["name"] and r["version"].startswith(v) for r in json.load(sys.stdin)["runtimes"]) else 1)' "$sdk"; then
            echo "iOS ${sdk} simulator runtime already installed"
          else
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes

      # Each phase is its own step so the run's step timings split build+unit from UI.
      - name: Unit tests (make test-unit; includes build-for-testing)
        if: env.TEST_MODE == 'unit' || env.TEST_MODE == 'ui'
        run: make test-unit

      # The runner is this repo's alone, so no slot pool: two simulator clones, the most its memory
      # holds (scripts/_destination.sh, take_slots).
      - name: UI tests (make test-ui, 2 workers)
        if: env.TEST_MODE == 'ui'
        # Under the job's 90: a step timeout fails the step, so the result bundles still upload,
        # while a job timeout cancels the run and skips the upload.
        timeout-minutes: 60
        env:
          SIMULATOR_WORKERS_WITHOUT_POOL: "2"
        run: make test-ui

      # One class or test, serially, N times in one job, so a flake that shows only on this runner
      # costs one build rather than a whole suite per try. A UI class first warms the fresh
      # simulator up with the unit tests, as make test-only does locally. A name that matches no
      # test fails the step rather than passing with nothing run.
      - name: One class or test (make test-only)
        id: one
        if: env.TEST_MODE == 'one'
        env:
          TEST: ${{ inputs.test }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          rc=0
          make test-only ONLY="$TEST" ITERATIONS="$ITERATIONS" || rc=$?
          bundle=$(find .build/sim/results -maxdepth 1 -name '*-only.xcresult' 2>/dev/null | head -1)
          if [[ -n "$bundle" ]]; then
            tally=$(python3 scripts/ci/tally_iterations.py "$bundle" || true)
            echo "tally=${tally}" >> "$GITHUB_OUTPUT"
            echo "$tally" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$tally" == "Tally: no test results"* && "$rc" == 0 ]]; then
              echo "::error::'${TEST}' matched no test"
              rc=1
            fi
          fi
          exit "$rc"

      # Failures are easier to read in the bundle than in the log. A single class or test keeps its
      # bundle when it passes too: with a flake, the passing runs are evidence as well.
      - name: Upload test result bundles
        if: >-
          failure() || (!cancelled() && env.TEST_MODE == 'one')
        uses: actions/upload-artifact@v7
        with:
          name: xcresults
          path: .build/sim/results/*.xcresult
          retention-days: 7

  # --- Report back to the PR that asked for this run (a /ci comment) --------------
  # Also runs when a started run was cancelled, so it still leaves its line on the PR (a run
  # cancelled while still queued never starts, so it posts nothing).
  report:
    needs: [lint, secrets, check-large-files, i18n-gates, changes, build, test]
    if: always() && inputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment the results on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          NEEDS: ${{ toJSON(needs) }}
          SELECTION: ${{ inputs.only || 'gates+build' }}
          TESTS: ${{ inputs.test && format('test=`{0}` x{1}', inputs.test, inputs.iterations) || format('tests={0}', inputs.tests) }}
          TALLY: ${{ needs.test.outputs.tally }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rows=$(jq -r '
            {success: "✅", failure: "❌", skipped: "⏭️", cancelled: "🚫"} as $icon
            | to_entries[] | "| `\(.key)` | \($icon[.value.result] // "") \(.value.result) |"' <<<"$NEEDS")
          verdict=$(jq -r '[.[].result] as $r
            | if ($r | index("failure")) then "❌ failed"
              elif ($r | index("cancelled")) then "🚫 cancelled"
              else "✅ passed" end' <<<"$NEEDS")
          {
            echo "**CI ${verdict}** on \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`: ${SELECTION}, ${TESTS}. [Run](${RUN_URL})"
            echo
            if [[ -n "$TALLY" ]]; then
              echo "$TALLY"
              echo
            fi
            echo "| Job | Result |"
            echo "|---|---|"
            echo "$rows"
          } > report.md
          gh pr comment "$PR" --body-file report.md
