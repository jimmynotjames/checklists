# .gitleaks.toml — repo-local gitleaks config.
#
# Extends the default ruleset (which we still want) with a Mixpanel-token rule.
#
# A green scan proves nothing on its own: AGENTS.md §"Known issues".
#
# The real defense is that config/Secrets.local.xcconfig is gitignored. This rule is the
# second line: it catches a Mixpanel token pasted anywhere gitignore does not cover, such as
# straight into a Swift literal, a test fixture, or a doc.

[extend]
useDefault = true

[[rules]]
id = "mixpanel-project-token"
description = "Mixpanel project token (32-char hex near a mixpanel/token keyword)"
# The gap between keywords is permissive so it matches the SDK call itself,
# `Mixpanel.initialize(token: "…")`, where "(" and "." sit between "mixpanel" and "token".
regex = '''(?i)mixpanel[^\n]{0,40}?token[^\n]{0,20}?[=:][^\n]{0,12}?([a-f0-9]{32})'''
secretGroup = 1
keywords = ["mixpanel"]

# No allowlist, deliberately — and do not add one.
#
# In particular, never exempt config/Secrets.xcconfig by path. It is COMMITTED, and its key
# names are precisely what invite someone to paste a real token there, so it is the file this
# rule most needs to watch. A path regex is also easy to under-anchor, which would silently
# exempt neighbours like config/Secrets.xcconfig.prod.
#
# Placeholders (PLACEHOLDER_MIXPANEL_DEV_TOKEN, etc.) aren't 32 hex chars, so they can't
# match secretGroup — both committed config files scan clean.
