# https://lefthook.dev/configuration/
#
# Ported from the `simple-recurring-budgets` repo. Install with `make hooks-install`
# (or `make system`).
#
# Everything in pre-commit runs on {staged_files} ONLY. That is deliberate: this is a
# 2020-era tree with ~96 pre-existing SwiftLint violations, so a repo-wide gate would
# block every commit. Files are brought up to standard as they are touched.
pre-commit:
  parallel: false
  commands:
    swiftformat:
      glob: "**/*.swift"
      run: swiftformat {staged_files}
      stage_fixed: true

    swiftlint-fix:
      glob: "**/*.swift"
      run: swiftlint --fix --quiet {staged_files}
      stage_fixed: true

    swiftlint:
      glob: "**/*.swift"
      run: swiftlint lint --strict {staged_files}

    check-merge-conflicts:
      run: bash -c 'set -f; files=(); for f in {staged_files}; do [ "$f" = lefthook.yml ] || files+=("$f"); done; [ "${#files[@]}" -eq 0 ] || ! grep -q "<<<""<<<<" -- "${files[@]}"'

    check-large-files:
      run: bash scripts/check-large-files.sh {staged_files}

    gitleaks:
      run: gitleaks protect --staged --no-banner

pre-push:
  commands:
    # Belt-and-braces: both branches also have server-side branch protection. This
    # just fails faster and more legibly than a rejected push.
    #
    # `gh-pages` is protected for the same reason as `main`, not a weaker one: it is
    # the public site, it carries the privacy policy that the App Store listing and
    # the in-app Settings link both point at, and a push to it is live immediately.
    no-direct-protected-push:
      run: |
        branch="$(git rev-parse --abbrev-ref HEAD)"
        case "$branch" in
          main|gh-pages)
            echo "error: direct push to $branch is not allowed - open a PR instead" >&2
            exit 1
            ;;
        esac

    # Compile check only. `simple-recurring-budgets` also runs its i18n gates here; this repo has no
    # localization pipeline. Tests are deliberately not run on push — see AGENTS.md.
    build:
      run: bash scripts/build.sh
