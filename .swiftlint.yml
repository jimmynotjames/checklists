# https://realm.github.io/SwiftLint/rule-directory.html
disabled_rules:
  - trailing_whitespace
  # SwiftFormat uses trailing commas for multiline collection literals.
  - trailing_comma
  # Common in tests; SwiftFormat handles brace placement elsewhere.
  - implicit_optional_initialization
  # Existing TODOs in the tree are tracked as GitHub issues, not SwiftLint noise.
  - todo

opt_in_rules:
  - empty_count
  - first_where
  - toggle_bool
  - redundant_nil_coalescing
  - sorted_imports
  - modifier_order
  - contains_over_first_not_nil
  - vertical_whitespace_closing_braces
  # Swift concurrency
  - unhandled_throwing_task
  # SwiftUI and accessibility
  - private_swiftui_state
  - accessibility_label_for_image
  - accessibility_trait_for_button

excluded:
  - tmp
  - .claude
  - .build
  - build
  - DerivedData
  - checklists/checklists.xcodeproj

line_length:
  warning: 225
  error: 275
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

function_body_length:
  warning: 120
  error: 150

file_length:
  warning: 750
  error: 900

type_body_length:
  warning: 500
  error: 550

function_parameter_count:
  warning: 10
  error: 12

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - s
    - vm
    - c
    - n
    - b
    - p
    - q
    - d
    - ui
    - e

type_name:
  # Legacy lowercase test class names. `type_name` requires UpperCamelCase; renaming
  # them would churn the Xcode project's test identifiers, so they are excluded.
  excluded:
    - checklistsTests
    - checklistsUITests
    - checklistCreateUITest
