# https://realm.github.io/SwiftLint/rule-directory.html
#
# Ported from the budgets1 repo, with this project's names substituted.
#
# Pre-commit lints STAGED FILES ONLY (see lefthook.yml). The repo-wide `make lint` target
# exists but is deliberately NOT part of `make gate` — this is a 2020-era tree and a
# repo-wide --strict pass would block every commit until the whole codebase is rewritten.
# Files are brought up to standard as they are touched. Tighten over time.
disabled_rules:
  - trailing_whitespace
  # SwiftFormat uses trailing commas for multiline collection literals.
  - trailing_comma
  # Common in tests; SwiftFormat handles brace placement elsewhere.
  - implicit_optional_initialization
  # Existing TODOs in the tree are tracked as GitHub issues, not SwiftLint noise.
  - todo

opt_in_rules:
  - empty_count
  - first_where
  - toggle_bool
  - redundant_nil_coalescing
  - sorted_imports
  - modifier_order
  - contains_over_first_not_nil
  - vertical_whitespace_closing_braces

excluded:
  - .build
  - build
  - DerivedData
  - checklists/checklists.xcodeproj

line_length:
  warning: 225
  error: 275
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

function_body_length:
  warning: 120
  error: 150

file_length:
  warning: 750
  error: 900

type_body_length:
  warning: 500
  error: 550

function_parameter_count:
  warning: 10
  error: 12

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - s
    - vm
    - c
    - n
    - b
    - p
    - q
    - d
    - ui
    - e

type_name:
  # These four are pre-existing lowercase class names in the 2020 test targets.
  # `type_name` requires UpperCamelCase; renaming them is a separate refactor
  # (it would churn the Xcode project's test identifiers), so they are excluded.
  excluded:
    - checklistsTests
    - checklistsUITests
    - checklistUITest
    - checklistCreateUITest
